name: Release plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 1.1.1). Created if it doesn't exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # If the release already exists (e.g. created via the GitHub UI when
        # tagging), attach the plugin files to it instead of failing. On
        # manual dispatch, the tag comes from the input and is created by
        # `gh release create` pointing at the built commit.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
              main.js manifest.json styles.css
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
